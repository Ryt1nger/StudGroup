  schemas:
    NotificationInbox:
      type: object
      required: [items, unread_count, generated_at]
      properties:
        generated_at: { type: string, format: date-time }
        unread_count: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required:
              [id, title, body, entity_type, entity_id, created_at, read]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              body: { type: string }
              entity_type:
                { type: string, enum: [homework, deadline, schedule] }
              entity_id: { type: string, format: uuid }
              created_at: { type: string, format: date-time }
              read: { type: boolean }
    ScheduleResponse:
      type: object
      required:
        [
          generated_at,
          group_timezone,
          start,
          end,
          week_state,
          first_week_anchor,
          selected_week,
          lessons,
        ]
      properties:
        generated_at: { type: string, format: date-time }
        group_timezone: { type: string }
        start: { type: string, format: date }
        end: { type: string, format: date }
        week_state: { type: string, enum: [ready, needs_clarification] }
        first_week_anchor: { type: [string, "null"], format: date }
        selected_week: { type: [string, "null"], enum: [first, second, null] }
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/LessonOccurrence"
    LessonOccurrence:
      type: object
      required: [id, subject, starts_at, ends_at, teacher, location, status]
      properties:
        id: { type: string }
        subject: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        teacher: { type: [string, "null"] }
        location:
          type: [string, "null"]
          description: Display-ready location text, e.g. «Ауд. 320» or «Зал 2». Clients render it as supplied without adding a prefix.
        status: { type: string, enum: [scheduled, cancelled] }
        online_url:
          type: [string, "null"]
          format: uri
          description: Optional HTTPS joining URL scoped to this group lesson; not a homework/material link. The external platform may require its own login.
    SessionBootstrapRequest:
      type: object
      additionalProperties: false
      required: [init_data]
      properties:
        init_data:
          type: string
          minLength: 1
          description: Raw Telegram Mini App initData string, not parsed client data.
    SessionBootstrapResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, session]
      properties:
        access_token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Unpadded base64url encoding of 32 random bytes; never a JWT.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        session:
          $ref: "#/components/schemas/SessionContext"
    SessionContext:
      type: object
      additionalProperties: false
      required: [user, access_state, permissions, server_time]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_state:
          $ref: "#/components/schemas/AccessState"
        membership:
          oneOf:
            - $ref: "#/components/schemas/Membership"
            - type: "null"
        group:
          oneOf:
            - $ref: "#/components/schemas/Group"
            - type: "null"
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Permission"
        server_time:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required: [id, telegram_user_id, display_name]
      properties:
        id:
          type: string
          format: uuid
        telegram_user_id:
          type: integer
          format: int64
        display_name:
          type: string
        username:
          type: [string, "null"]
    Membership:
      type: object
      additionalProperties: false
      required: [id, role, status, can_recheck]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          type: string
          enum: [active, suspended, left]
        next_check_at:
          type: [string, "null"]
          format: date-time
        can_recheck:
          type: boolean
    Group:
      type: object
      additionalProperties: false
      required: [id, name, timezone, status, pilot_authorized]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          example: Europe/Moscow
        status:
          type: string
          enum: [active, deletion_pending, read_only]
        pilot_authorized:
          type: boolean
          description: Always true for a group exposed by an active pilot session.
    AccessState:
      type: string
      enum:
        - active
        - no_active_group
        - membership_suspended
        - membership_left
        - group_deletion_pending
    MemberRole:
      type: string
      enum: [student, deputy, headman]
    Permission:
      type: string
      enum:
        - schedule.read
        - today.read
        - homework.read
        - homework.completion.write
        - homework.edit
        - homework.material.write
    HomeworkListResponse:
      type: object
      additionalProperties: false
      required:
        [
          server_time,
          generated_at,
          group_timezone,
          freshness,
          processing,
          items,
          next_cursor,
        ]
      properties:
        server_time:
          type: string
          format: date-time
          description: Selection time frozen across a cursor chain; use generated_at for the live clock.
        generated_at:
          type: string
          format: date-time
        group_timezone:
          type: string
        freshness:
          $ref: "#/components/schemas/Freshness"
        processing:
          $ref: "#/components/schemas/FeedProcessing"
        items:
          type: array
          items:
            $ref: "#/components/schemas/HomeworkSummary"
        next_cursor:
          type: [string, "null"]
          description: Pass unchanged with the same filter and session; null means no further page.
    TodayResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - server_time
        - group_timezone
        - freshness
        - processing
        - empty
        - sections
      properties:
        next_lesson:
          description: Backend-selected current or next group lesson within 32 days; null if none.
          oneOf:
            - $ref: "#/components/schemas/NextLesson"
            - type: "null"
        day_lessons_state:
          type: string
          enum: [scheduled, finished, empty, unknown]
          description: State of the selected group calendar day. Finished means at least one scheduled lesson existed and all have ended according to actual server time. Empty means covered timetable with no scheduled lessons. Unknown means missing coverage or unresolved timetable; never claim lessons finished from next_lesson alone. Optional for backward compatibility. Today UI uses next_lesson only when its start is on the selected day.
        generated_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        group_timezone:
          type: string
          example: Europe/Moscow
        freshness:
          $ref: "#/components/schemas/Freshness"
        processing:
          $ref: "#/components/schemas/FeedProcessing"
        empty:
          type: boolean
        sections:
          type: array
          description: Ordered by backend (due_today, new_or_changed, upcoming); the client preserves order. new_or_changed contains only existing assignments with a significant update within the last 24 hours, not newly created or imported assignments. Import normalization and initial inferred timetable dates do not count as live updates. Personally completed items with a known active deadline remain eligible in their normal sections with my_state preserved; completed items without a known deadline are excluded. Cancelled and past-deadline items are archived and excluded immediately; date-only deadlines remain active through their group calendar day. Empty sections are omitted. These display rules do not delete stored homework. Legacy overdue section kind remains accepted but is no longer returned.
          items:
            $ref: "#/components/schemas/TodaySection"
    TodaySection:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [overdue, due_today, new_or_changed, upcoming]
        items:
          type: array
          items:
            $ref: "#/components/schemas/HomeworkSummary"
    AcademicDeadline:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          subject,
          title,
          description,
          deadline_at,
          date_only,
          window_start,
          window_end,
          date_hint,
          needs_clarification,
          source_message_ids,
        ]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            [
              control_point,
              assessment,
              test,
              credit,
              exam,
              other_academic_deadline,
            ]
        card_kind: { $ref: "#/components/schemas/LearningCardKind" }
        subject: { type: string }
        confirmed_subject:
          oneOf:
            - $ref: "#/components/schemas/SubjectRef"
            - type: "null"
        title: { type: string }
        description: { type: string }
        deadline_at: { type: [string, "null"], format: date-time }
        date_only: { type: boolean }
        deadline_certainty:
          type: string
          enum: [confirmed, from_source, inferred, needs_clarification, unknown]
        deadline_origin:
          type: string
          enum:
            [
              explicit_message,
              schedule_inferred,
              ambiguous_message,
              manual,
              imported,
              unknown,
            ]
        window_start: { type: [string, "null"], format: date-time }
        window_end: { type: [string, "null"], format: date-time }
        date_hint: { type: [string, "null"] }
        needs_clarification: { type: boolean }
        source_message_ids: { type: array, items: { type: integer } }
        sources:
          {
            type: array,
            minItems: 1,
            items: { $ref: "#/components/schemas/SourceDetail" },
          }
        updates:
          {
            type: array,
            items: { $ref: "#/components/schemas/LearningCardUpdate" },
          }
        revision: { type: integer, minimum: 1 }
        cancelled_at: { type: [string, "null"], format: date-time }
        materials:
          { type: array, items: { $ref: "#/components/schemas/MaterialLink" } }
    FileUploadLink:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri }
    MaterialLink:
      type: object
      required: [id, title, url]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url:
          type: string
          description: >-
            An absolute https link, or, for a file kept in Telegram (`kind` other than `link`), an
            API-relative signed path `/v1/files/{id}?exp=..&sig=..` valid for 6 hours. Resolve it against
            the API base URL; it needs no Authorization header.
        kind:
          type: string
          enum: [link, photo, document, video, audio, voice, animation]
          default: link
        file_name: { type: [string, "null"] }
        mime_type: { type: [string, "null"] }
        size_bytes: { type: [integer, "null"], minimum: 0 }
    LearningCardUpdate:
      type: object
      additionalProperties: false
      required: [id, kind, text, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [supplement, change, cancellation] }
        text: { type: string }
        created_at: { type: string, format: date-time }
    SubjectListResponse:
      type: object
      additionalProperties: false
      required: [generated_at, group_timezone, items]
      properties:
        generated_at: { type: string, format: date-time }
        group_timezone: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SubjectOverview" }
    SubjectOverview:
      type: object
      additionalProperties: false
      required: [id, name, homework_count, deadline_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        homework_count: { type: integer, minimum: 0 }
        deadline_count: { type: integer, minimum: 0 }
    LessonSubjectResponse:
      type: object
      additionalProperties: false
      required:
        [
          generated_at,
          group_timezone,
          lesson,
          homework,
          homework_total,
          events_state,
          materials_state,
        ]
      properties:
        generated_at: { type: string, format: date-time }
        group_timezone: { type: string }
        lesson: { $ref: "#/components/schemas/LessonOccurrence" }
        homework:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/HomeworkSummary" }
        homework_total:
          type: integer
          minimum: 0
          description: Number matching the context. Response includes at most 100; full list remains available in Tasks.
        events_state:
          type: string
          enum: [not_connected, ready]
          description: Ready indicates connected academic deadlines. Do not infer classification from the homework title on the client.
        events:
          type: array
          items: { $ref: "#/components/schemas/AcademicDeadline" }
        materials_state:
          type: string
          enum: [not_connected, ready]
          description: Ready means group-scoped manually added material links are connected.
        materials:
          { type: array, items: { $ref: "#/components/schemas/MaterialLink" } }
    NextLesson:
      type: object
      additionalProperties: false
      required: [state, lesson]
      properties:
        state: { type: string, enum: [current, upcoming] }
        lesson:
          $ref: "#/components/schemas/LessonOccurrence"
    Freshness:
      type: object
      additionalProperties: false
      required: [last_successful_sync_at, stale]
      properties:
        last_successful_sync_at:
          type: string
          format: date-time
        stale:
          type: boolean
          description: True after 15 minutes without a successful refresh.
    FeedProcessing:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, updating, delayed]
        retry_after_seconds:
          type: [integer, "null"]
          minimum: 1
    HomeworkSummary:
      type: object
      required:
        - id
        - type
        - title
        - subject
        - deadline
        - status
        - urgency
        - visibility
        - verification_state
        - revision
        - source
        - processing
        - significant_update
        - my_state
        - created_at
        - updated_at
      properties:
        materials:
          { type: array, items: { $ref: "#/components/schemas/MaterialLink" } }
        id:
          type: string
          format: uuid
        type:
          type: string
          const: homework
        card_kind:
          $ref: "#/components/schemas/LearningCardKind"
        title:
          type: string
        subject:
          $ref: "#/components/schemas/SubjectRef"
        confirmed_subject:
          description: >-
            Confirmed subject for new clients. Null means that publication did not establish a
            subject. The legacy subject field remains populated during the compatibility window.
          oneOf:
            - $ref: "#/components/schemas/SubjectRef"
            - type: "null"
        summary:
          type: [string, "null"]
        deadline:
          $ref: "#/components/schemas/Deadline"
        status:
          $ref: "#/components/schemas/HomeworkStatus"
        urgency:
          $ref: "#/components/schemas/Urgency"
        visibility:
          $ref: "#/components/schemas/Visibility"
        verification_state:
          $ref: "#/components/schemas/VerificationState"
        revision:
          type: integer
          minimum: 1
          description: Group-card revision; personal completion never increments it.
        source:
          $ref: "#/components/schemas/SourceSummary"
        processing:
          $ref: "#/components/schemas/ItemProcessing"
        significant_update:
          type: boolean
        significant_updated_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
          description: Time cancellation took effect; later edits do not reset it. Cancelled items appear immediately in the archive regardless of whether this timestamp is known. No deletion.
        my_state:
          $ref: "#/components/schemas/MyHomeworkState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HomeworkDetail:
      allOf:
        - $ref: "#/components/schemas/HomeworkSummary"
        - type: object
          required: [description, source_detail, permissions, generated_at]
          properties:
            description:
              type: [string, "null"]
            source_detail:
              $ref: "#/components/schemas/SourceDetail"
            sources:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/SourceDetail" }
              description: >-
                Evidence for the currently published projection revision. source_detail is kept
                as the first item for old clients.
            updates:
              type: array
              items: { $ref: "#/components/schemas/LearningCardUpdate" }
            permissions:
              type: array
              uniqueItems: true
              items:
                $ref: "#/components/schemas/Permission"
            generated_at:
              type: string
              format: date-time
    SubjectRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Deadline:
      type: object
      additionalProperties: false
      required: [state, date_only]
      properties:
        state:
          type: string
          enum: [known, unknown]
        at:
          type: [string, "null"]
          format: date-time
          description: Null when state is unknown.
        date_only:
          type: boolean
          description: True when no exact time was established.
        certainty:
          type: string
          enum: [confirmed, from_source, inferred, needs_clarification, unknown]
          description: Confidence of this deadline only; never inferred from whole-card status by clients.
        origin:
          type: string
          enum:
            [
              explicit_message,
              schedule_inferred,
              ambiguous_message,
              manual,
              imported,
              unknown,
            ]
          description: Student-safe origin; no model confidence, prompt or internal evidence metadata.
    LearningCardKind:
      type: string
      description: >-
        Exhaustive canonical semantic kinds. The current writer projects homework to Homework;
        all other values are projected to AcademicDeadline and cannot use personal completion.
      enum:
        [
          homework,
          test,
          control_point,
          assessment,
          credit,
          exam,
          other_academic_deadline,
        ]
    HomeworkStatus:
      type: string
      description: detected and incomplete_hidden are internal and never returned.
      enum: [needs_clarification, published, completed, cancelled]
    Urgency:
      type: string
      enum: [normal, urgent, super_urgent]
      description: Sole source of urgent labels and styling in the client.
    Visibility:
      type: string
      enum: [group, personal]
    VerificationState:
      type: string
      description: Verification metadata for the current viewer. The needs_clarification value is returned only to an active headman or deputy; students receive from_group_message for the same published AI card. This field does not control group visibility.
      enum:
        - manual_confirmed
        - from_group_message
        - inferred
        - needs_clarification
        - imported
    SourceSummary:
      type: object
      required: [kind, imported, availability]
      properties:
        kind:
          $ref: "#/components/schemas/SourceKind"
        imported:
          type: boolean
        availability:
          $ref: "#/components/schemas/SourceAvailability"
    SourceDetail:
      allOf:
        - $ref: "#/components/schemas/SourceSummary"
        - type: object
          required: [message_date, excerpt, action]
          properties:
            id:
              type: [string, "null"]
              format: uuid
              description: Stable retained source id when available.
            telegram_message_id:
              type: [integer, "null"]
              description: Group-local Telegram message id; not a credential.
            message_date:
              type: [string, "null"]
              format: date-time
            excerpt:
              type: [string, "null"]
            action:
              $ref: "#/components/schemas/SourceAction"
    SourceKind:
      type: string
      enum:
        - telegram_group_message
        - telegram_direct_message
        - imported_history
        - manual_entry
    SourceAvailability:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [available, unavailable]
        reason:
          type: [string, "null"]
          enum:
            - retention_expired
            - no_deep_link
            - message_deleted
            - no_access
            - imported_without_link
            - unknown
            - null
    SourceAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [open_telegram_link, none]
        url:
          type: [string, "null"]
          format: uri
          pattern: '^https://t\.me/'
          description: Backend-built Telegram message URL; only the https://t.me host is allowed.
    ItemProcessing:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [none, reanalyzing, delayed]
        retry_after_seconds:
          type: [integer, "null"]
          minimum: 1
    MyHomeworkState:
      type: object
      additionalProperties: false
      required: [completion]
      properties:
        completion:
          type: string
          enum: [pending, completed]
        completed_at:
          type: [string, "null"]
          format: date-time
        completed_revision:
          type: [integer, "null"]
          minimum: 1
    DeadlineInput:
      type: object
      additionalProperties: false
      description: Offset-aware instant; `date_only` keeps the whole day. Omit `at` (or send null) to clear.
      properties:
        at: { type: [string, "null"], format: date-time }
        date_only: { type: boolean, default: false }
    EditHomeworkRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 8000 }
        subject_name: { type: string, minLength: 1, maxLength: 255 }
        deadline:
          oneOf:
            - $ref: "#/components/schemas/DeadlineInput"
            - type: "null"
    EditAcademicDeadlineRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        kind:
          type: string
          enum: [control_point, assessment, test, credit, exam, other_academic_deadline]
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 8000 }
        subject: { type: string, minLength: 1, maxLength: 255 }
        deadline:
          oneOf:
            - $ref: "#/components/schemas/DeadlineInput"
            - type: "null"
        date_hint: { type: [string, "null"], maxLength: 1000 }
    SetCompletionRequest:
      type: object
      additionalProperties: false
      required: [completed, expected_revision]
      properties:
        completed:
          type: boolean
        expected_revision:
          type: integer
          minimum: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, retryable]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - initdata_invalid
            - initdata_expired
            - session_expired
            - no_active_group
            - not_group_member
            - membership_suspended
            - membership_left
            - group_not_authorized_for_pilot
            - invitation_expired
            - invitation_consumed
            - group_deletion_pending
            - permission_denied
            - not_found
            - gone
            - revision_conflict
            - rate_limited
            - service_unavailable
            - internal_error
        message:
          type: string
        correlation_id:
          type: string
        retryable:
          type: boolean
        retry_after_seconds:
          type: [integer, "null"]
          minimum: 1
        field_path:
          type: [string, "null"]
          description: JSON Pointer to an invalid request field when applicable.
        details:
          type: [object, "null"]
          additionalProperties: true
