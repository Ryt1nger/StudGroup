    HomeworkDetailUnavailable:
      summary: Imported homework with unknown deadline and unavailable source
      value:
        id: 66666666-6666-4666-8666-666666666666
        type: homework
        title: Подготовить презентацию
        subject:
          id: 77777777-7777-4777-8777-777777777777
          name: Маркетинг
        summary: Точная дата уточняется
        deadline:
          state: unknown
          at: null
          date_only: false
        status: needs_clarification
        urgency: normal
        visibility: group
        verification_state: imported
        revision: 1
        source:
          kind: imported_history
          imported: true
          availability:
            state: unavailable
            reason: imported_without_link
        processing:
          state: none
          retry_after_seconds: null
        significant_update: false
        significant_updated_at: null
        my_state:
          completion: pending
          completed_at: null
          completed_revision: null
        created_at: '2026-09-20T10:00:00Z'
