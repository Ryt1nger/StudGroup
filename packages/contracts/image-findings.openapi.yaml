openapi: 3.1.0
info:
  title: StudGroup image findings review (pilot, disabled by default)
  version: 0.2.0
  description: >-
    Additive draft backend contract. Requires explicit group allowlist and review feature flags.
    Separate events and editor-confirmed publication are owner-approved. Frontend integration and actual activation remain pending.
servers:
  - url: https://api.studgroup.example/v1
security:
  - bearerAuth: []
paths:
  /staff/image-findings/images:
    get:
      operationId: imageAnalysisDiagnostics
      responses:
        '200': {description: Latest 200 group-local job statuses, sanitized errors, usage, conservative cost and latency; never source pixels or raw reading text}
        '403': {description: Headman/deputy membership required}
        '404': {description: Diagnostics flag or group allowlist disabled}
  /staff/image-findings/schedule:
    get:
      operationId: listImageScheduleSuggestions
      description: Headman/deputy only; returns retained group-local draft rows and source schedule version.
      responses:
        '200': {description: 'suggestions array: id, revision, state, schedule_version, rows'}
        '403': {description: Membership role disallows review}
        '404': {description: Feature disabled or not allowlisted}
  /staff/image-findings/schedule/{id}/confirm:
    post:
      operationId: confirmImageScheduleSuggestion
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, expected_schedule_version]
              properties:
                expected_revision: {type: integer, minimum: 1}
                expected_schedule_version: {type: integer, minimum: 0}
                corrected_rows:
                  description: Optional editor-corrected full rows; preserve AI rows separately for audit. Each subgroup_id must belong to this group and subject.
                  type: [array, 'null']
                  maxItems: 100
                  items: {$ref: '#/components/schemas/ConfirmedScheduleRow'}
                targets:
                  type: array
                  items:
                    type: object
                    required: [row_index, lesson_id, pattern_revision, override_revision]
                    properties:
                      row_index: {type: integer, minimum: 0}
                      lesson_id: {type: string}
                      pattern_revision: {type: integer, minimum: 1}
                      override_revision: {type: integer, minimum: 0}
                      scope: {type: string, enum: [once, recurring], default: once}
      responses:
        '200': {description: Confirmed schedule_version; repeated confirmation has no repeated side effects}
        '403': {description: Membership role disallows confirmation}
        '404': {description: Not found or feature disabled}
        '409': {description: 'Stale source/context/revision, missing dates or unresolved subgroup/lesson mapping'}
  /staff/image-findings/events:
    get:
      operationId: listImageEventDrafts
      responses:
        '200': {description: Retained group events with revisions and applied/held source findings; staff only}
        '403': {description: Membership role disallows review}
        '404': {description: Review flag disabled}
  /staff/image-findings/events/{id}:
    put:
      operationId: reviewImageEvent
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, payload]
              properties:
                expected_revision: {type: integer, minimum: 1}
                state: {type: string, enum: [draft, active, cancelled], default: draft}
                accept_source_ids: {type: array, items: {type: string, format: uuid}}
                payload: {$ref: '#/components/schemas/EventPayload'}
      responses:
        '200': {description: Updated event and revision; manual lock is retained}
        '403': {description: Staff membership required}
        '404': {description: Event not found or activation/publication flag disabled}
        '409': {description: Stale revision/source or event is not publishable}
  /group-events:
    get:
      operationId: listPublishedGroupEvents
      responses:
        '200': {description: Approved active group events retained through local end date + 7 days inclusive; private source expiry never removes the approved record}
        '401': {description: Active authenticated membership required}
        '404': {description: Publication disabled}
  /group-events/{id}:
    get:
      operationId: getPublishedGroupEvent
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Published event payload with id/revision/state}
        '404': {description: Private, unknown, unapproved, expired, wrong group or feature disabled; retained cancelled events remain accessible by id}
components:
  schemas:
    ConfirmedScheduleRow:
      type: object
      additionalProperties: false
      required: [weekday, starts, ends, subject, valid_from, valid_until]
      properties:
        weekday: {type: integer, minimum: 0, maximum: 6}
        starts: {type: string, format: time}
        ends: {type: string, format: time}
        subject: {type: string, minLength: 1, maxLength: 255}
        subject_id: {type: [string, 'null'], format: uuid}
        subgroup: {type: [string, 'null'], maxLength: 255}
        subgroup_id: {type: [string, 'null'], format: uuid}
        week: {type: string, enum: [all, first, second], default: all}
        valid_from: {type: string, format: date}
        valid_until: {type: string, format: date}
        room: {type: [string, 'null'], maxLength: 255}
        teacher: {type: [string, 'null'], maxLength: 255}
    EventPayload:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 8000, default: ''}
        when_text: {type: [string, 'null'], maxLength: 1000}
        starts_at: {type: [string, 'null'], format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
        starts_on: {type: [string, 'null'], format: date}
        ends_on: {type: [string, 'null'], format: date}
        multi_day: {type: boolean, default: false}
        place: {type: [string, 'null'], maxLength: 500}
        conditions: {type: [string, 'null'], maxLength: 2000}
        audience: {type: string, enum: [group, subgroup, personal, unknown], default: unknown}
        audience_label: {type: [string, 'null'], maxLength: 255}
        action: {type: string, enum: [create, update, cancel], default: create}
        existing_event_id: {type: [string, 'null'], format: uuid}
        expected_revision: {type: [integer, 'null'], minimum: 1}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
