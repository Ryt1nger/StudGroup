name: Backend
on:
  push:
    paths: ['apps/backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['apps/backend/**', '.github/workflows/backend.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studgroup_test
          POSTGRES_USER: studgroup_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studgroup_test -d studgroup_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://studgroup_test:ephemeral-ci-only@localhost:5432/studgroup_test
      POSTGRES_TEST_URL: postgresql+asyncpg://studgroup_test:ephemeral-ci-only@localhost:5432/studgroup_test
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --dev --frozen
      - name: Temporary format validation
        run: |
          uv run ruff check --fix src/studgroup/admin_insights.py tests/test_admin_insights.py
          uv run ruff format src/studgroup/admin_insights.py tests/test_admin_insights.py
          python - <<'PY'
          import base64
          from pathlib import Path
          for p in [Path("src/studgroup/admin_insights.py"), Path("tests/test_admin_insights.py")]:
              print("FORMATTED_BEGIN " + str(p), flush=True)
              encoded = base64.b64encode(p.read_bytes()).decode("ascii")
              for i in range(0, len(encoded), 384):
                  print("FORMATTED_PART " + encoded[i:i+384], flush=True)
              print("FORMATTED_END " + str(p), flush=True)
          PY
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest
