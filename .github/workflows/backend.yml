name: Backend
on:
  push:
    paths: ['apps/backend/**', 'deploy/server/**', '.github/workflows/backend.yml', '.github/workflows/ranepa-crawl.yml', '.github/workflows/ranepa-watchdog.yml']
  pull_request:
    paths: ['apps/backend/**', 'deploy/server/**', '.github/workflows/backend.yml', '.github/workflows/ranepa-crawl.yml', '.github/workflows/ranepa-watchdog.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studgroup_test
          POSTGRES_USER: studgroup_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studgroup_test -d studgroup_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://studgroup_test:ephemeral-ci-only@localhost:5432/studgroup_test
      POSTGRES_TEST_URL: postgresql+asyncpg://studgroup_test:ephemeral-ci-only@localhost:5432/studgroup_test
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --diff . || true
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - name: Verify upgrade from deployed 0053
        run: |
          uv run alembic downgrade 0053
          uv run alembic upgrade head
      - name: Verify 0066 downgrade and replay on disposable CI PostgreSQL
        run: |
          uv run alembic downgrade 0065
          uv run alembic current | grep -F "0065"
          uv run alembic upgrade 0066
          uv run alembic current | grep -F "0066"
          uv run alembic downgrade 0065
          uv run alembic current | grep -F "0065"
          uv run alembic upgrade head
      - name: Verify process controls, urgent SDO and payment settings
        run: |
          uv run pytest -q tests/test_process_control.py tests/test_process_runtime.py tests/test_urgent_sdo.py tests/test_ranepa_autonomous_runtime.py tests/test_admin_dashboard.py tests/test_profile.py tests/test_ranepa_crawl_jobs.py --maxfail=1
      - name: Verify group billing and Telegram checkout in isolation
        run: |
          uv run pytest -q tests/test_billing_plans.py tests/test_billing_checkout.py tests/test_billing_manual.py tests/test_billing_campaign.py tests/test_bot_info.py --maxfail=1
      - name: Repeat safety regressions in different file orders
        run: |
          uv run pytest -q tests/test_ranepa_materialization.py tests/test_package_worker.py tests/test_ranepa_captcha_outcome.py tests/test_ranepa_worker.py --maxfail=1
          uv run pytest -q tests/test_ranepa_worker.py tests/test_ranepa_captcha_outcome.py tests/test_package_worker.py tests/test_ranepa_materialization.py --maxfail=1
      - run: uv run pytest -vv --maxfail=1

  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate release shell syntax
        run: bash -n deploy/server/deploy.sh
      - name: Build independent SDO image
        run: docker build -f apps/backend/Dockerfile.ranepa-worker -t studgroup-sdo-ci apps/backend
      - name: Launch Chromium as the runtime user without network
        run: |
          docker run --rm --network none --shm-size=256m --entrypoint python studgroup-sdo-ci -c 'import os; from playwright.sync_api import sync_playwright; assert os.getuid() == 10001; p = sync_playwright().start(); b = p.chromium.launch(headless=True); page = b.new_page(); page.goto("about:blank"); b.close(); p.stop()'
