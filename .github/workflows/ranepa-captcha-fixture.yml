name: RANEPA isolated CAPTCHA fixture

# Test-only: two synthetic images, locally intercepted page, no YDB/PG
# access and no university traffic. Paid API calls require two opt-ins.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ranepa-captcha-fixture.yml
      - apps/backend/src/studgroup/ranepa_captcha_fixture.py
      - apps/backend/tests/test_ranepa_captcha_fixture.py
  workflow_dispatch:
    inputs:
      provider:
        description: "Mock FREE; RuCaptcha: 2 paid tasks, up to 5 with explicit retries"
        type: choice
        required: true
        default: mock
        options:
          - mock
          - rucaptcha
      confirm_paid:
        description: "I approve 2 paid jobs, or up to 5 if retry_wrong_angles is also checked"
        type: boolean
        required: true
        default: false
      retry_wrong_angles:
        description: "Allow at most THREE EXTRA paid RotateTask submissions for WRONG angles (5 total)"
        type: boolean
        required: true
        default: false
      progressive_context:
        description: "Use first answer to virtually align LEFT in the second task instructions"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ranepa-isolated-captcha-fixture
  cancel-in-progress: false

jobs:
  fixture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Reject paid mode without explicit confirmation
        if: inputs.provider == 'rucaptcha' && inputs.confirm_paid != true
        run: |
          echo "Choose confirm_paid=true to authorize 2 or up to 5 paid tasks with retries."
          exit 1
      - name: Install isolated test dependencies
        run: |
          uv sync --frozen
          uv run python -m playwright install chromium --with-deps
      - name: Run offline mock using real client code (no credentials)
        if: github.event_name == 'push' || inputs.provider == 'mock'
        env:
          PROGRESSIVE: ${{ github.event_name == 'push' || inputs.progressive_context }}
          RETRY: ${{ inputs.retry_wrong_angles }}
        run: |
          mkdir -p fixture-output
          args=(--provider mock --timeout-seconds 360 --screenshot fixture-output/mock.png)
          if [ "$PROGRESSIVE" = "true" ]; then args+=(--progressive-context); fi
          if [ "$RETRY" = "true" ]; then
            args+=(--max-resends 3 --mock-wrong-first-side right)
          fi
          uv run python -m studgroup.ranepa_captcha_fixture "${args[@]}"
      - name: Free browser smoke with one wrong worker answer and bounded retry
        if: github.event_name == 'push'
        run: |
          uv run python -m studgroup.ranepa_captcha_fixture --provider mock --timeout-seconds 360 --progressive-context --max-resends 3 --mock-wrong-first-side right --screenshot fixture-output/mock-retry.png
      - name: Run RuCaptcha v2 on synthetic fixture (2 jobs, or up to 5 with explicit retry opt-in)
        if: inputs.provider == 'rucaptcha' && inputs.confirm_paid == true
        env:
          CAPTCHA_API_KEY: ${{ secrets.RUCAPTCHA_API_KEY }}
          PROGRESSIVE: ${{ inputs.progressive_context }}
          RETRY: ${{ inputs.retry_wrong_angles }}
        run: |
          test -n "$CAPTCHA_API_KEY" || { echo "RUCAPTCHA_API_KEY secret missing"; exit 1; }
          mkdir -p fixture-output
          args=(--provider rucaptcha --allow-paid --timeout-seconds 360 --screenshot fixture-output/rucaptcha.png)
          if [ "$PROGRESSIVE" = "true" ]; then args+=(--progressive-context); fi
          if [ "$RETRY" = "true" ]; then args+=(--allow-extra-paid --max-resends 3); fi
          uv run python -m studgroup.ranepa_captcha_fixture "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-rotate-fixture
          path: apps/backend/fixture-output/*.png
          if-no-files-found: ignore
          retention-days: 2
