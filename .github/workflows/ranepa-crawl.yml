name: RANEPA paced crawl

# Owner-approved scheduled launch: default-branch only, serial, fail-closed
# on legal/credential/Telegram preflight. No student is accessed without consent.
# VPS is the default autonomous worker. Legacy runners are explicit recovery only.
# Manual and tagged owner actions retain their existing separate safeguards.
on:
  # Explicit one-off owner activation on a tagged main-branch commit.
  # Ordinary main pushes create a skipped job, not an account crawl.
  push:
    branches:
      - main
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      pilot_group_id:
        description: "UUID of the single approved pilot group"
        required: true
        type: string
      pilot_user_id:
        description: "UUID of the single consented pilot user"
        required: true
        type: string
      diagnostic_only:
        description: "Inspect the CAPTCHA without contacting RuCaptcha or moving sliders"
        required: true
        type: boolean
        default: true
      dual_rotate_v2:
        description: "Explicitly authorize up to TWO paid RotateTask v2 jobs with shared context"
        required: true
        type: boolean
        default: false
      progressive_context_v2:
        description: "Use first answer to virtually align LEFT in second task instructions"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ranepa-paced-crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.RANEPA_EXECUTION_BACKEND == 'github' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-sdo-once]') || contains(github.event.head_commit.message, '[run-sdo-all-once]') || contains(github.event.head_commit.message, '[run-sdo-recovery-pilot]') || contains(github.event.head_commit.message, '[run-sdo-retry-captcha-failures]') || contains(github.event.head_commit.message, '[run-sdo-retry-missing-weeks]') || contains(github.event.head_commit.message, '[run-sdo-sample-15]'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.pilot_group_id != '' && inputs.pilot_user_id != ''))
    runs-on: ubuntu-latest
    # Full owner-instructed rescan may include many ten-minute account timeouts.
    timeout-minutes: 185
    env:
      DATABASE_URL: ${{ secrets.RANEPA_DATABASE_URL }}
      PROFILE_ENCRYPTION_KEY: ${{ secrets.RANEPA_PROFILE_ENCRYPTION_KEY }}
      YDB_DOCUMENT_ENDPOINT: ${{ secrets.RANEPA_YDB_DOCUMENT_ENDPOINT }}
      YDB_ACCESS_KEY_ID: ${{ secrets.RANEPA_YDB_ACCESS_KEY_ID }}
      YDB_SECRET_ACCESS_KEY: ${{ secrets.RANEPA_YDB_SECRET_ACCESS_KEY }}
      LEGAL_OPERATOR_NAME: ${{ secrets.LEGAL_OPERATOR_NAME }}
      LEGAL_OPERATOR_ADDRESS: ${{ secrets.LEGAL_OPERATOR_ADDRESS }}
      LEGAL_OPERATOR_CONTACT: ${{ secrets.LEGAL_OPERATOR_CONTACT }}
      LEGAL_DATA_REGION: ${{ secrets.LEGAL_DATA_REGION }}
      LEGAL_DOCUMENTS_APPROVED: ${{ secrets.LEGAL_DOCUMENTS_APPROVED }}
      RANEPA_ACCESS_APPROVED: ${{ secrets.RANEPA_ACCESS_APPROVED }}
      RANEPA_CRAWL_ENABLED: "true"
      RANEPA_FORCE_RESCAN_ALL_APPROVED: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sdo-all-once]') }}
      RANEPA_CRAWL_PAUSE_SECONDS: "20"
      # Owner-only alerts are queued to the existing app BotOutbox. The API
      # bot (not this runner) sends them; no Telegram token on GitHub runner.
      BOT_ADMIN_USER_ID: ${{ secrets.RANEPA_CRAWL_BOT_ADMIN_USER_ID || vars.RANEPA_CRAWL_BOT_ADMIN_USER_ID || secrets.BOT_ADMIN_USER_ID || vars.BOT_ADMIN_USER_ID }}
      # Requires migration 0061 and the same production PostgreSQL database.
      # Pilot tests cannot trigger a global scheduled queue pause.
      RANEPA_CAPTCHA_GUARD_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || vars.RANEPA_CAPTCHA_GUARD_ENABLED == 'true' }}
      RANEPA_CRAWL_TELEMETRY_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || vars.RANEPA_CRAWL_TELEMETRY_ENABLED == 'true' }}
      # Notifications are owner-only and sent through the backend BotOutbox.
      RANEPA_CRAWL_NOTIFY_SUCCESS_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || secrets.RANEPA_CRAWL_BOT_ADMIN_USER_ID != '' || vars.RANEPA_CRAWL_BOT_ADMIN_USER_ID != '' || secrets.BOT_ADMIN_USER_ID != '' || vars.BOT_ADMIN_USER_ID != '' }}
      RANEPA_CRAWL_NOTIFY_CAPTCHA_SEEN_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || secrets.RANEPA_CRAWL_BOT_ADMIN_USER_ID != '' || vars.RANEPA_CRAWL_BOT_ADMIN_USER_ID != '' || secrets.BOT_ADMIN_USER_ID != '' || vars.BOT_ADMIN_USER_ID != '' }}
      # Owner receives one outcome per completed account, including failed and
      # timetable-only reads where no verified SDO links were extracted.
      RANEPA_CRAWL_NOTIFY_ACCOUNT_RESULTS_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || secrets.RANEPA_CRAWL_BOT_ADMIN_USER_ID != '' || vars.RANEPA_CRAWL_BOT_ADMIN_USER_ID != '' || secrets.BOT_ADMIN_USER_ID != '' || vars.BOT_ADMIN_USER_ID != '' }}
      # Owner sees the whole live puzzle ONLY when RuCaptcha failed or was
      # unavailable. Signed Telegram initData controls challenge access.
      RANEPA_MANUAL_CAPTCHA_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.diagnostic_only != true) }}
      RANEPA_MANUAL_CAPTCHA_BASE_URL: ${{ vars.STUDGROUP_API_ORIGIN || 'https://studgroup-api-v2.onrender.com' }}
      # Paid CAPTCHA is enabled for approved scheduled and full-rescan jobs.
      # Preserve server-verified CAPTCHA resolution and owner fallback.
      CAPTCHA_API_KEY: ${{ secrets.RUCAPTCHA_API_KEY }}
      # Paid mode requires an additional explicit v2 pair checkbox. An old
      # manual dispatch without it cannot silently spend on two tasks.
      RANEPA_CAPTCHA_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.diagnostic_only != true && inputs.dual_rotate_v2 == true && vars.RANEPA_CAPTCHA_PILOT_ENABLED == 'true') }}
      RANEPA_CAPTCHA_V2_PAIR_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.diagnostic_only != true && inputs.dual_rotate_v2 == true && vars.RANEPA_CAPTCHA_PILOT_ENABLED == 'true') }}
      # Must additionally opt in to BOTH paid pair and virtual-left preview;
      # never alter an existing paid pilot or a scheduled queue silently.
      RANEPA_CAPTCHA_V2_PROGRESSIVE_CONTEXT_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only != true && inputs.dual_rotate_v2 == true && inputs.progressive_context_v2 == true && vars.RANEPA_CAPTCHA_PILOT_ENABLED == 'true' }}
      RANEPA_CAPTCHA_DIAGNOSTIC_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true }}
      # Three full solution attempts per account, at most two v2 tasks per
      # attempt; aggregate run tasks remain bound by the shared daily cap.
      RANEPA_CAPTCHA_MAX_TASKS_PER_RUN: "60"
      # Owner approved wider temporary CAPTCHA capacity for recovery: 60 paid tasks/day
      # across all runners, with single-attempt limits and human fallback retained.
      # Every runner, including targeted pilots, reserves the shared DB budget.
      # Daily budget remains DB-locked to prevent overlapping workers.
      RANEPA_CAPTCHA_DAILY_MAX_TASKS: "60"
      # Encrypted Cookie Reuse must be approved independently for a manual pilot.
      # Scheduled multi-account jobs retain the existing non-persistent flow.
      # Reuse encrypted account-scoped sessions in a tagged, approved pilot only
      # when the owner explicitly enabled the existing pilot feature flag.
      RANEPA_SESSION_REUSE_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && vars.RANEPA_SESSION_REUSE_PILOT_ENABLED == 'true') || (github.event_name == 'schedule' && vars.RANEPA_SESSION_REUSE_SCHEDULED_ENABLED == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sdo-sample-15]') && vars.RANEPA_SESSION_REUSE_PILOT_ENABLED == 'true') }}
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Check required secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$PROFILE_ENCRYPTION_KEY"
          test -n "$YDB_DOCUMENT_ENDPOINT"
          test -n "$YDB_ACCESS_KEY_ID"
          test -n "$YDB_SECRET_ACCESS_KEY"
          test -n "$LEGAL_OPERATOR_NAME"
          test -n "$LEGAL_OPERATOR_ADDRESS"
          test -n "$LEGAL_OPERATOR_CONTACT"
          test -n "$LEGAL_DATA_REGION"
          test "$LEGAL_DOCUMENTS_APPROVED" = "true"
          test "$RANEPA_ACCESS_APPROVED" = "true"
          # Owner identity is checked before the first student is claimed:
          # use configured BOT_ADMIN_USER_ID or require exactly one verified,
          # private admin panel in the same production database. Do not print IDs.
      - name: Install pinned backend dependencies
        run: uv sync --frozen
      - name: Require compatible Alembic schema before any SDO account access
        run: |
          current="$(uv run alembic current)"
          if ! printf '%s\n' "$current" | grep -Eq '(^|[^0-9])(006[6-9]|007[01])([^0-9]|$)'; then
            echo "::error title=Production migration required::Require a verified compatible schema (0066–0071) before legacy SDO recovery."
            exit 1
          fi
      - name: Install browser
        run: uv run python -m playwright install chromium --with-deps
      - name: Run exactly one approved pilot account
        if: github.event_name == 'workflow_dispatch'
        env:
          PILOT_GROUP_ID: ${{ inputs.pilot_group_id }}
          PILOT_USER_ID: ${{ inputs.pilot_user_id }}
        run: |
          # Empty GitHub variables must not reach Pydantic settings at import time.
          if [ -z "$BOT_ADMIN_USER_ID" ]; then unset BOT_ADMIN_USER_ID; fi
          uv run python -m studgroup.ranepa_worker --pilot-group-id "$PILOT_GROUP_ID" --pilot-user-id "$PILOT_USER_ID"
      - name: Process one bounded queue shift
        if: github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[run-sdo-all-once]') && !contains(github.event.head_commit.message, '[run-sdo-recovery-pilot]') && !contains(github.event.head_commit.message, '[run-sdo-retry-captcha-failures]') && !contains(github.event.head_commit.message, '[run-sdo-retry-missing-weeks]') && !contains(github.event.head_commit.message, '[run-sdo-sample-15]'))
        run: |
          # Keep missing optional admin ID absent until the verified DB lookup.
          if [ -z "$BOT_ADMIN_USER_ID" ]; then unset BOT_ADMIN_USER_ID; fi
          uv run python -m studgroup.ranepa_worker --batch-minutes 24
      - name: Run an approved 15-account cross-group SDO sample
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sdo-sample-15]')
        run: |
          # Real queued and due accounts only: selection alternates groups,
          # checks consent again and never bypasses retry/captcha safeguards.
          if [ -z "$BOT_ADMIN_USER_ID" ]; then unset BOT_ADMIN_USER_ID; fi
          uv run python -m studgroup.ranepa_worker --batch-minutes 160 --sample-accounts 15
      - name: Process one explicitly approved full SDO rescan
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sdo-all-once]')
        env:
          # All eligible accounts are re-scanned once. Give their RuCaptcha
          # requests a shared per-run allowance; daily DB budget still caps 60.
          RANEPA_CAPTCHA_MAX_TASKS_PER_RUN: "60"
        run: |
          # Only this tagged main-branch push may override 24-hour cooldown.
          # The workflow concurrency group still serializes all SDO crawls.
          if [ -z "$BOT_ADMIN_USER_ID" ]; then unset BOT_ADMIN_USER_ID; fi
          uv run python -m studgroup.ranepa_worker --batch-minutes 160 --force-rescan-all
      - name: Run one verified owner CAPTCHA recovery pilot
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sdo-recovery-pilot]')
        env:
          # Three complete v2 attempts may reserve two provider tasks each.
          # The real account remains selected privately inside the DB.
          RANEPA_CAPTCHA_MAX_TASKS_PER_RUN: "6"
        run: |
          if [ -z "$BOT_ADMIN_USER_ID" ]; then unset BOT_ADMIN_USER_ID; fi
          uv run python -m studgroup.ranepa_recovery_pilot
      - name: Retry exactly the prior CAPTCHA-failed accounts
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sdo-retry-captcha-failures]')
        env:
          # Up to three selected accounts, three full attempts of two tasks.
          RANEPA_CAPTCHA_MAX_TASKS_PER_RUN: "18"
        run: |
          if [ -z "$BOT_ADMIN_USER_ID" ]; then unset BOT_ADMIN_USER_ID; fi
          uv run python -m studgroup.ranepa_recovery_pilot --retry-failed
      - name: Retry only earlier SDO failures still missing the current verified week
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sdo-retry-missing-weeks]')
        env:
          # Up to eight eligible accounts; each can use three pairs.
          # The shared daily DB cap of 60 remains absolute.
          RANEPA_CAPTCHA_MAX_TASKS_PER_RUN: "48"
        run: |
          if [ -z "$BOT_ADMIN_USER_ID" ]; then unset BOT_ADMIN_USER_ID; fi
          uv run python -m studgroup.ranepa_retry_missing_weeks
