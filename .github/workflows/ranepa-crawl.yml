name: RANEPA paced crawl

# Scheduled runs use only the default branch. Never run this with PR code.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      pilot_group_id:
        description: "UUID of the single approved pilot group"
        required: true
        type: string
      pilot_user_id:
        description: "UUID of the single consented pilot user"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ranepa-paced-crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.RANEPA_CRAWL_PILOT_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.pilot_group_id != '' && inputs.pilot_user_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      DATABASE_URL: ${{ secrets.RANEPA_DATABASE_URL }}
      PROFILE_ENCRYPTION_KEY: ${{ secrets.RANEPA_PROFILE_ENCRYPTION_KEY }}
      YDB_DOCUMENT_ENDPOINT: ${{ secrets.RANEPA_YDB_DOCUMENT_ENDPOINT }}
      YDB_ACCESS_KEY_ID: ${{ secrets.RANEPA_YDB_ACCESS_KEY_ID }}
      YDB_SECRET_ACCESS_KEY: ${{ secrets.RANEPA_YDB_SECRET_ACCESS_KEY }}
      LEGAL_OPERATOR_NAME: ${{ secrets.LEGAL_OPERATOR_NAME }}
      LEGAL_OPERATOR_ADDRESS: ${{ secrets.LEGAL_OPERATOR_ADDRESS }}
      LEGAL_OPERATOR_CONTACT: ${{ secrets.LEGAL_OPERATOR_CONTACT }}
      LEGAL_DATA_REGION: ${{ secrets.LEGAL_DATA_REGION }}
      LEGAL_DOCUMENTS_APPROVED: ${{ secrets.LEGAL_DOCUMENTS_APPROVED }}
      RANEPA_ACCESS_APPROVED: ${{ secrets.RANEPA_ACCESS_APPROVED }}
      RANEPA_CRAWL_ENABLED: "true"
      RANEPA_CRAWL_PAUSE_SECONDS: "20"
      # Paid CAPTCHA solving is available only for a manually selected pilot.
      # Never enable it for scheduled multi-account queue shifts.
      CAPTCHA_API_KEY: ${{ secrets.RUCAPTCHA_API_KEY }}
      RANEPA_CAPTCHA_ENABLED: ${{ github.event_name == 'workflow_dispatch' && vars.RANEPA_CAPTCHA_PILOT_ENABLED == 'true' }}
      RANEPA_CAPTCHA_MAX_TASKS_PER_RUN: "1"
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Check required secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$PROFILE_ENCRYPTION_KEY"
          test -n "$YDB_DOCUMENT_ENDPOINT"
          test -n "$YDB_ACCESS_KEY_ID"
          test -n "$YDB_SECRET_ACCESS_KEY"
          test -n "$LEGAL_OPERATOR_NAME"
          test -n "$LEGAL_OPERATOR_ADDRESS"
          test -n "$LEGAL_OPERATOR_CONTACT"
          test -n "$LEGAL_DATA_REGION"
          test "$LEGAL_DOCUMENTS_APPROVED" = "true"
          test "$RANEPA_ACCESS_APPROVED" = "true"
      - name: Install browser
        run: |
          uv sync --frozen
          uv run python -m playwright install chromium --with-deps
      - name: Run exactly one approved pilot account
        if: github.event_name == 'workflow_dispatch'
        env:
          PILOT_GROUP_ID: ${{ inputs.pilot_group_id }}
          PILOT_USER_ID: ${{ inputs.pilot_user_id }}
        run: uv run python -m studgroup.ranepa_worker --pilot-group-id "$PILOT_GROUP_ID" --pilot-user-id "$PILOT_USER_ID"
      - name: Process one bounded queue shift
        if: github.event_name == 'schedule'
        run: uv run python -m studgroup.ranepa_worker --batch-minutes 24
