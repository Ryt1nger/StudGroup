name: Keep the Render API awake

# Render Free can sleep when idle. Keeping it awake 24/7 consumes shared
# workspace instance hours. Explicit opt-in is required after migration.
# A single manual /ready check is allowed without a multi-hour wake loop.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || vars.STUDGROUP_KEEPALIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STUDGROUP_API_ORIGIN: ${{ vars.STUDGROUP_API_ORIGIN || 'https://studgroup-api-v2.onrender.com' }}
    steps:
      - name: Ping the selected Render API /ready
        run: curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 60 "${STUDGROUP_API_ORIGIN}/ready"
