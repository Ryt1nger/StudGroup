# Development dependencies. API runs with uv from apps/backend.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studgroup
      POSTGRES_USER: studgroup
      POSTGRES_PASSWORD: studgroup
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studgroup -d studgroup"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
